[project]
name = "heft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=1.14.0",
    "diffusers==0.42.1",
    "ftfy>=6.3.1",
    "numpy>=2.4.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.1.1",
    "protobuf>=7.35.1",
    "python-dotenv>=1.2.2",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "transformers>=5.0,<6",
    "triton==3.6.0; platform_system == 'Linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heft"]

[tool.uv.sources]
diffusers = { path = "diffusers", editable = true }
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.pyright]
include = ["src", "test", "scripts"]
venvPath = "."
venv = ".venv"
